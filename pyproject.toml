[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-governance-kit"
version = "0.1.0"
description = "SCIM, SAML, OIDC, Slack and GitHub Enterprise governance tooling with SOC 2 evidence mapping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "signxml>=3.2",
  "lxml>=5.0",
  "cryptography>=42",
  "pyjwt[crypto]>=2.8",
  "slack-bolt>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
scim-server = "saas_governance_kit.scim.__main__:main"
github-audit = "saas_governance_kit.github.cli:main"
slack-audit-logs = "saas_governance_kit.slack.audit_cli:main"
soc2-report = "saas_governance_kit.soc2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
